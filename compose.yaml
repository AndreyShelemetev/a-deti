name: ${COMPOSE_PROJECT_NAME:-a-deti}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-atour}
      MARIADB_USER: ${MARIADB_USER:-atour}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    image: ${APP_IMAGE:-a-deti:local}
    build: .
    restart: unless-stopped
    environment:
      AT_STANDALONE: "1"
      AT_DB_DSN: mysql:host=db;dbname=${MARIADB_DATABASE:-atour};charset=utf8mb4
      AT_DB_USER: ${MARIADB_USER:-atour}
      AT_DB_PASSWORD_FILE: /run/secrets/db_password
      BUILD: ${BUILD:-local}
    secrets:
      - db_password
    ports:
      - 127.0.0.1:${APP_PORT:-8080}:80
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sessions:/var/lib/php/sessions

  proxy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

secrets:
  db_password:
    file: ${AT_SECRETS_DIR:-./.secrets}/db_password
  db_root_password:
    file: ${AT_SECRETS_DIR:-./.secrets}/db_root_password

volumes:
  database:
  sessions:
  certificates:
  caddy_config:
