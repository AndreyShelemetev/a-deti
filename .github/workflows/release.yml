name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Имя и версия образа
        id: meta
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'sha=%s\nimage=%s\n' "$SOURCE_SHA" "$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Публикация проверенного образа
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          build-args: BUILD=${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    concurrency:
      group: a-deti-production
      cancel-in-progress: false
    steps:
      - name: Проверка актуальности main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.image.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          if [[ "$latest" == "$SOURCE_SHA" ]]; then
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
            printf 'Более новый коммит main уже ожидает выкладки; этот выпуск пропущен.\n'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: ${{ needs.image.outputs.sha }}
          persist-credentials: false
      - name: Доставка и проверка выпуска
        if: steps.current.outputs.deploy == 'true'
        env:
          SOURCE_SHA: ${{ needs.image.outputs.sha }}
          APP_IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_DIR; do
            [[ -n "${!name}" ]] || { printf 'Не задан secret %s.\n' "$name" >&2; exit 1; }
          done
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 ))
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APP_IMAGE" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          [[ "$DEPLOY_DIR" =~ ^/[a-zA-Z0-9_-]+(/[a-zA-Z0-9_.-]+)+$ ]]
          [[ "/$DEPLOY_DIR/" != *'/../'* && "/$DEPLOY_DIR/" != *'/./'* ]]
          key="$RUNNER_TEMP/a-deti-deploy-key"
          hosts="$RUNNER_TEMP/a-deti-known-hosts"
          archive="$RUNNER_TEMP/a-deti-release.tar"
          trap 'rm -f "$key" "$hosts" "$archive"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          tar -cf "$archive" compose.yaml docker/Caddyfile ops/*.sh
          remote="$DEPLOY_DIR/.deploy/incoming-$SOURCE_SHA"
          ssh -i "$key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            "umask 077; mkdir -p '$remote' && tar -xf - -C '$remote' && bash '$remote/ops/deploy.sh' '$APP_IMAGE' '$SOURCE_SHA' '$DEPLOY_DIR'" \
            < "$archive"
