name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Проверка shell и JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find ops tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Сборка PHP-образа
        run: docker build --build-arg BUILD="$GITHUB_SHA" -t a-deti:local .
      - name: Проверка отката и обязательной резервной копии
        run: bash tests/deploy-script.sh
      - name: Проверка PHP
        run: >-
          docker run --rm --entrypoint sh a-deti:local -c
          'find /var/www/html -type f \( -name "*.php" -o -name "*.php.example" \) -print0 | xargs -0 -r -n1 php -l'
      - name: Проверка развёртывания и переноса базы
        run: bash tests/deployment.sh
