name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adeti
          POSTGRES_PASSWORD: adeti
          POSTGRES_DB: adeti
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adeti"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://adeti:adeti@localhost:5432/adeti?schema=public
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm exec next typegen && pnpm typecheck
      - run: pnpm test
      - run: pnpm exec next build
