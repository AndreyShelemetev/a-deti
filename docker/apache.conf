ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        RewriteEngine On
        # Only the public entry points and asset directories are accessible.
        RewriteRule ^(?:inc|data|bin|ops|docker|tests|backups|var)(?:/|$) - [F,END,NC]
        RewriteRule (^|/)\. - [F,END]
        RewriteRule ^(?:Dockerfile|compose[^/]*\.ya?ml|README\.md|SOURCE\.json|db\.php(?:\.example)?|config\.php)$ - [F,END,NC]
        RewriteRule \.(?:sql|gz|bundle|ini|sh|ya?ml|md|json|log)$ - [F,END,NC]
        RewriteRule ^site-admin/?$ site-admin.php [END]
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^(?:index|site-admin|media|healthz)\.php$ - [END]
        RewriteRule \.php(?:/|$) - [F,END,NC]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [END]
    </Directory>
    # Only our private reverse proxy can supply the HTTPS indication.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Content-Type-Options nosniff
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
